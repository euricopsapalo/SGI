# #208 — nginx da imagem de produção do frontend (Dockerfile.prod).
# Serve a SPA (build do React) e faz proxy de /api para o backend, na mesma origem.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Anexos das OTs: até 10 fotos × 5 MB por pedido (ot-anexos.controller.ts).
    client_max_body_size 60m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API → backend (o serviço `backend` do docker-compose, porta 3001, prefixo /api).
    location /api/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A geração de PDFs no servidor (#182) pode demorar alguns segundos.
        proxy_read_timeout 120s;
    }

    # Ficheiros com hash no nome (build do CRA): cache longa.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # O index.html nunca fica em cache, para cada deploy chegar logo ao browser.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA: rotas do React Router (ex.: /ordens, /vendas) caem no index.html ao recarregar.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
