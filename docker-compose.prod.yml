# #53 — Override de PRODUÇÃO: segredos via Docker secrets (montados em /run/secrets/*)
# em vez de variáveis de ambiente do processo.
#
# Uso (Docker Swarm) — #208: os `!override`/`!reset` abaixo exigem resolver o merge
# com o Docker Compose (≥ 2.24) antes do deploy; o `stack deploy` não constrói imagens:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml build
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml config > sgi-stack.yml
#   docker stack deploy -c sgi-stack.yml sgi
# (Sem Swarm: `docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build`.)
#
# Os segredos são `external: true` — têm de ser criados ANTES do deploy:
#   printf '%s' "$(openssl rand -hex 32)" | docker secret create sgi_jwt_secret -
#   printf '%s' 'a_password_forte'        | docker secret create sgi_db_password -
#   printf '%s' 'gmail_app_password'      | docker secret create sgi_mail_pass  -
#
# O backend lê cada segredo do ficheiro apontado por *_FILE (helper readSecret);
# o Postgres usa POSTGRES_PASSWORD_FILE (suporte nativo da imagem oficial).
# Ver docs/producao-segredos.md para o procedimento completo (criar/rodar).

services:
  postgres:
    environment:
      # A password deixa de vir em texto; passa a ser lida do ficheiro do secret.
      POSTGRES_PASSWORD_FILE: /run/secrets/sgi_db_password
      # POSTGRES_PASSWORD explícito removido (definido em docker-compose.yml só p/ dev).
    secrets:
      - sgi_db_password

  backend:
    # Sem bind-mount do código nem start:dev em produção.
    command: npm run start:prod
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: app_user
      DB_NAME: app_development
      PORT: 3001
      # Segredos por ficheiro (readSecret usa *_FILE com precedência sobre a env).
      DB_PASSWORD_FILE: /run/secrets/sgi_db_password
      JWT_SECRET_FILE: /run/secrets/sgi_jwt_secret
      MAIL_PASS_FILE: /run/secrets/sgi_mail_pass
      # #197 — admin inicial: só usado se ainda não existir nenhum admin. Para o
      # primeiro deploy, crie o secret `sgi_seed_admin_password`, acrescente-o à
      # lista `secrets` abaixo e descomente a linha seguinte.
      # SEED_ADMIN_PASSWORD_FILE: /run/secrets/sgi_seed_admin_password
      # Não-segredos continuam como env normais.
      CORS_ORIGIN: ${CORS_ORIGIN:-https://sgi.aquatex.ao}
      MAIL_HOST: smtp.gmail.com
      MAIL_PORT: "587"
      MAIL_SECURE: "false"
      MAIL_USER: ${MAIL_USER:-}
      MAIL_FROM: '"SGI — Aquatex" <${MAIL_USER:-noreply@aquatex.ao}>'
      # #47 — fotos/assinaturas persistem num volume nomeado (não no filesystem efémero).
      UPLOADS_DIR: /app/uploads
    # #208 — `!override` substitui os volumes de dev (bind-mount ./backend:/app e
    # node_modules), que o Compose juntaria aos de produção em vez de os trocar.
    volumes: !override
      - sgi_uploads:/app/uploads
    secrets:
      - sgi_db_password
      - sgi_jwt_secret
      - sgi_mail_pass

  # #208 — Frontend de produção: build estático servido por nginx (Dockerfile.prod),
  # que faz proxy de /api para o backend na mesma origem. Substitui o servidor de
  # desenvolvimento (`npm start`, hot-reload, bind-mount) do docker-compose.yml.
  frontend:
    image: ${SGI_FRONTEND_IMAGE:-sgi-frontend:latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    environment: !reset {}
    volumes: !reset []
    ports: !override
      - "${SGI_HTTP_PORT:-80}:80"
    mem_limit: 256m

volumes:
  sgi_uploads:

secrets:
  sgi_db_password:
    external: true
  sgi_jwt_secret:
    external: true
  sgi_mail_pass:
    external: true
